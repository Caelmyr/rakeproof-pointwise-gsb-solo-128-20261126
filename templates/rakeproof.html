<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>RakeProof · 斜光起伏校验台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='rakeproof.css') }}">
  <script src="{{ url_for('static', filename='rakeproof.js') }}" defer></script>
</head>
<body aria-busy="false">
<header class="banner">
  <div class="identity"><span class="mark" aria-hidden="true"></span><span class="wordmark">RakeProof</span><h1>斜光起伏校验台</h1></div>
  <a href="{{ url_for('index') }}">图像准备工作台 <span aria-hidden="true">↗</span></a>
</header>
<main>
  <section class="intake" aria-label="打开原片">
    <form id="practice">
      <label for="sample">打开合成练习</label>
      <div class="inline">
        <select id="sample" name="sample">
          <option value="tooling">刻线与印痕</option>
          <option value="ink">薄印字与浅沟</option>
          <option value="shadow">斜照亮斑和遮挡</option>
        </select>
        <button type="submit" class="primary">打开练习</button>
      </div>
    </form>
    <form id="reopen">
      <label for="cards">已存核验卡</label>
      <div class="inline"><select id="cards"><option value="">选择卡片</option></select><button type="submit">重开</button></div>
    </form>
    <details id="upload-panel">
      <summary>导入两向斜照</summary>
      <form id="upload" enctype="multipart/form-data">
        <label>核验卡名<input name="name" maxlength="80" placeholder="例如 03 号工具压痕"></label>
        <label>左向斜照<input type="file" name="left" accept="image/png,image/jpeg,image/tiff,image/bmp,image/webp" required></label>
        <label>右向斜照<input type="file" name="right" accept="image/png,image/jpeg,image/tiff,image/bmp,image/webp" required></label>
        <button type="submit" class="primary">导入原片</button>
      </form>
    </details>
  </section>
  <p id="status" role="status" aria-live="polite">打开合成练习，或导入同一试样在两向斜光下拍摄的照片。</p>
  <section id="workspace" hidden>
    <header class="inspection-title"><div><h2 id="card-title"></h2><p id="card-meta"></p></div><span id="revision"></span></header>
    <div class="bench">
      <article class="image-panel">
        <div class="toolbar">
          <label>查看<select id="view">
            <option value="map">坡向叠图</option><option value="left">左照原片</option>
            <option value="right">右照放入左照网格</option><option value="blend">两照交叠</option>
          </select></label>
          <div class="modes" role="group" aria-label="图上操作">
            <button class="mode" type="button" data-mode="probe" aria-pressed="true">点读</button>
            <button class="mode" type="button" data-mode="zone" aria-pressed="false">框选量区</button>
            <button class="mode" type="button" data-mode="flat" aria-pressed="false">框选平面</button>
            <button class="mode" type="button" data-mode="scan" aria-pressed="false">定位横切线</button>
          </div>
        </div>
        <div class="canvas-frame"><canvas id="photo" aria-label="左照原片坐标网格"></canvas></div>
        <div class="legend">
          <span class="legend-positive">左照相对亮</span><span class="legend-negative">右照相对亮</span><span class="legend-invalid">缺曝光证据</span>
          <span class="legend-zone">量区</span><span class="legend-flat">平面参照</span>
        </div>
      </article>
      <aside class="side-panel">
        <section class="controls">
          <h3>核验设置</h3>
          <form id="settings">
            <div class="fields">
              <label>右照横移<input id="dx" type="number" step="1" required></label>
              <label>右照纵移<input id="dy" type="number" step="1" required></label>
              <label>横切线 Y<input id="scan_y" type="number" step="1" required></label>
              <label>坡向阈值 %<input id="threshold" type="number" min="1" max="95" step="any" required></label>
            </div>
            <p id="zone-read"></p><p id="flat-read"></p>
            <label class="check"><input id="balance" type="checkbox">启用平面亮度平衡</label>
            <button class="primary" type="submit" id="apply">应用读数设置</button>
          </form>
          <p class="note" id="gain"></p>
        </section>
        <section class="point-sheet">
          <h3>两照原像复查</h3>
          <form id="point-form" class="inline">
            <label>列 X <input id="point-x" type="number" min="0" step="1" required></label>
            <label>行 Y <input id="point-y" type="number" min="0" step="1" required></label>
            <button type="submit">读点</button>
          </form>
          <output id="readout" aria-live="polite">点原片或下方的横切线，也可输入左照坐标。</output>
        </section>
      </aside>
    </div>
    <div class="metrics" aria-label="量区统计">
      <div><span>成对覆盖</span><strong id="paired-count"></strong></div>
      <div><span>曝光可用</span><strong id="valid-count"></strong></div>
      <div><span>左亮坡像素</span><strong id="positive-count"></strong></div>
      <div><span>右亮坡像素</span><strong id="negative-count"></strong></div>
      <div><span>切线亮暗段</span><strong id="run-count"></strong></div>
    </div>
    <article class="profile-panel">
      <header><div><h3>横切线反差</h3><p id="section-range"></p></div><span>纵轴为两照归一化亮度差（%）</span></header>
      <canvas id="profile" height="160" aria-label="横切线反差曲线，点击读原点"></canvas>
      <div id="runs" class="runs" aria-label="横切线上的同向亮暗段"></div>
    </article>
    <footer class="exports">
      <div><h3>保存核验依据</h3><div class="inline" id="export-links">
        <a data-export="proof.png">量区校样 PNG</a><a data-export="section.csv">横切线 CSV</a><a data-export="evidence.zip">下载检查包 ZIP</a>
      </div></div>
      <div><h3>原片继续准备</h3><div class="inline">
        <a id="prepare-left" href="{{ url_for('index') }}">准备左照 ↗</a><a id="prepare-right" href="{{ url_for('index') }}">准备右照 ↗</a>
      </div></div>
    </footer>
  </section>
</main>
</body>
</html>
